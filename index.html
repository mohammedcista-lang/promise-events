<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise | لتنظيم التخاريج المتميزة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-red: #d32f2f;
            --brand-dark: #111111;
            --brand-gray: #f4f4f4;
            --white: #ffffff;
            --transition: all 0.3s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }
        body {
            background-color: var(--brand-gray);
            color: var(--brand-dark);
            line-height: 1.8;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 5%;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-container img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--brand-red);
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
        }
        .logo span {
            color: var(--brand-red);
        }
        .nav-links {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .nav-links a {
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            transition: var(--transition);
        }
        .nav-links a:hover {
            color: var(--brand-red);
        }
        .nav-contact-btn {
            background: var(--brand-red);
            color: white !important;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 3px 10px rgba(211, 47, 47, 0.3);
        }
        
        /* الواجهة الرئيسية */
        header {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), 
                        url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1600&auto=format&fit=crop') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 0 1rem;
        }
        .sub-tagline {
            background: var(--brand-red);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        header h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            color: #fff;
            line-height: 1.3;
        }
        header h1 span {
            color: var(--brand-red);
        }
        header p {
            font-size: 1.25rem;
            max-width: 700px;
            margin-bottom: 2rem;
            color: #ccc;
        }
        .btn {
            display: inline-block;
            background: var(--brand-red);
            color: var(--white);
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(225,29,37,0.5);
            transition: var(--transition);
        }
        .btn:hover {
            transform: translateY(-3px);
            background: #b71c1c;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 5rem 2rem;
        }
        section {
            padding: 4rem 0;
        }
        .section-title {
            text-align: center;
            margin-bottom: 3.5rem;
        }
        .section-title h2 {
            font-size: 2.5rem;
            color: var(--brand-dark);
            position: relative;
            display: inline-block;
            padding-bottom: 0.5rem;
        }
        .section-title h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 4px;
            background: var(--brand-red);
            border-radius: 2px;
        }

        /* من نحن */
        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            background: var(--white);
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .about-text h3 {
            font-size: 2rem;
            color: var(--brand-dark);
            margin-bottom: 1rem;
        }
        .about-text p {
            color: #555;
            margin-bottom: 1.2rem;
            font-size: 1.1rem;
        }
        .about-img img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* الخدمات */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }
        .service-card {
            background: var(--white);
            padding: 2.5rem 2rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: var(--transition);
            border-top: 4px solid var(--brand-red);
        }
        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .service-card i {
            font-size: 3rem;
            color: var(--brand-red);
            margin-bottom: 1.5rem;
        }
        .service-card h3 {
            font-size: 1.4rem;
            color: var(--brand-dark);
            margin-bottom: 1rem;
        }
        .service-card p {
            color: #555;
            font-size: 1rem;
        }

        /* المعرض */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            height: 300px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background: #000;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }
        .gallery-item:hover img {
            transform: scale(1.08);
            opacity: 0.9;
        }

        /* ليه نحن */
        .why-us {
            background: #111;
            color: #fff;
            padding: 5rem 2rem;
            border-radius: 20px;
            text-align: center;
            margin-top: 3rem;
        }
        .why-us h2 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
        .why-us h2 span {
            color: var(--brand-red);
        }
        .why-us p {
            font-size: 1.2rem;
            color: #ccc;
            max-width: 700px;
            margin: 0 auto 2rem;
        }
        .why-list {
            list-style: none;
            display: inline-block;
            text-align: right;
            margin-bottom: 2rem;
            font-size: 1.2rem;
            color: #ddd;
        }
        .why-list li {
            margin-bottom: 10px;
        }

        /* تواصل معنا */
        .contact-box {
            background: var(--brand-dark);
            color: #fff;
            padding: 4rem 2rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-bottom: 5px solid var(--brand-red);
            margin-top: 3rem;
        }
        .contact-box h2 {
            color: #fff;
            margin-bottom: 1rem;
            font-size: 2.2rem;
        }
        .contact-box p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            color: #ccc;
        }
        .contact-info {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
        }
        .contact-item i {
            color: var(--brand-red);
            font-size: 1.4rem;
        }
        
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: #25D366;
            color: #fff;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            text-decoration: none;
            z-index: 999;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: var(--transition);
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #25d366;
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: var(--transition);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }
        .btn-whatsapp:hover {
            background: #1ebe5d;
            transform: translateY(-3px);
        }

        footer {
            background: #111;
            color: #fff;
            text-align: center;
            padding: 2rem;
            font-size: 0.95rem;
            border-top: 1px solid #222;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2.2rem; }
